name: ios-mission-planner
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  # pinned to the openblas build: the mkl build of numpy's LAPACK backend
  # crashes (illegal instruction) on np.linalg.solve/cholesky/svd on at
  # least one development machine for this project
  - libblas=*=*openblas
  - libcblas=*=*openblas
  - liblapack=*=*openblas
  - heyoka.py
  - numpy
  - scipy
  - matplotlib
  - jupyter
  - sgp4
  - pygmo
  - osqp
  - pyyaml
  - jinja2
  - weasyprint
  - pytest
  - pip
  - pip:
      - -e .
